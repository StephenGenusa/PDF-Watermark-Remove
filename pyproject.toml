[project]
name = "removewatermarks"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.15"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pikepdf>=10.16.0",
    "pymupdf>=1.28.2",
    "pytesseract>=0.3.13",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not corpus'"
markers = ["corpus: slow acceptance tests against the real PDFs in ./Books"]
filterwarnings = [
    "ignore:'typing.ByteString' and 'collections.abc.ByteString' are deprecated:DeprecationWarning:pymupdf",
]

[tool.coverage.run]
source = ["pdf_watermark_remover"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
